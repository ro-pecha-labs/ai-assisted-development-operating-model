schema: om.project/v2

project:
  id: EXAMPLE
  name: Example DEV Project
  profile: DEV

control_plane:
  kind: git
  platform: github
  locator: https://github.com/example/example
  default_ref: main

governance:
  operating_model:
    repository: https://github.com/ro-pecha-labs/ai-assisted-development-operating-model
    # Instantiate both values from the exact immutable OM release adopted by the project.
    # The all-zero commit is a template sentinel and is rejected by project conformance.
    ref: REPLACE_WITH_ADOPTED_IMMUTABLE_OM_REF
    commit: "0000000000000000000000000000000000000000"
  project_rules:
    locator: .project/DEVELOPMENT_RULES.md
    format: markdown

state:
  active:
    locator: .project/ACTIVE_STATE.yaml
    format: yaml
