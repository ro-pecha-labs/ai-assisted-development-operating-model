name: Validate OM2

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'om-v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  structural-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate structural contracts
        run: python tools/validate.py
      - name: Qualify minimal recovery
        run: >-
          python tools/recovery_probe.py
          qualification/recovery/fixtures
          --expected qualification/recovery/expected.json
      - name: Qualify solo recovery
        run: >-
          python tools/recovery_probe.py
          qualification/recovery/fixtures-solo
          --expected qualification/recovery/expected-solo.json
      - name: Qualify OM 2.1 policy semantics
        run: python tools/qualify_om21.py
      - name: Qualify release identity pin guard
        shell: bash
        run: |
          GOOD=0123456789abcdef0123456789abcdef01234567
          BAD=89abcdef0123456789abcdef0123456789abcdef
          python tools/release_identity_guard.py --expected "$GOOD" --observed "$GOOD"
          if python tools/release_identity_guard.py --expected "$GOOD" --observed "$BAD"; then
            echo "Expected release identity mismatch to fail"
            exit 1
          fi
          echo "Release identity mismatch rejection PASS"
      - name: Qualify GitHub Actions runtime guard
        shell: bash
        run: |
          python tools/actions_runtime_guard.py .github/workflows
          if python tools/actions_runtime_guard.py qualification/actions-runtime/node20-negative.yml; then
            echo "Expected deprecated Node.js action runtime to fail"
            exit 1
          fi
          echo "Deprecated action runtime rejection PASS"
          python tools/actions_runtime_guard.py qualification/actions-runtime/node24-positive.yml
          python tools/actions_runtime_guard.py qualification/actions-runtime/unmapped-official.yml > guard-unmapped.out
          cat guard-unmapped.out
          grep -q '^UNJUDGED: ' guard-unmapped.out
          rm guard-unmapped.out
          if python tools/actions_runtime_guard.py qualification/actions-runtime/node20-negative-extended.yml > guard-extended.out; then
            cat guard-extended.out
            echo "Expected every mapped Node.js 20 action to fail"
            exit 1
          fi
          cat guard-extended.out
          test "$(grep -c '^FAIL: .*actions/' guard-extended.out)" -eq "$(python -c "import json;print(len(json.load(open('tools/actions_runtime_map.json'))['node24_min_major']))")"
          rm guard-extended.out
          python tools/actions_runtime_guard.py --report qualification/actions-runtime/node20-negative-extended.yml
          if python tools/actions_runtime_guard.py --map qualification/actions-runtime/invalid-map.json qualification/actions-runtime/node24-positive.yml; then
            echo "Expected invalid runtime map to fail"
            exit 1
          fi
          echo "Actions runtime map coverage PASS"
      - name: Qualify GitHub Actions runtime gate modes
        shell: bash
        run: |
          F=qualification/actions-runtime
          G=tools/actions_runtime_gate.py
          # Q0: the reusable workflow keeps the non-failing default
          python - <<'PY'
          import yaml
          w = yaml.safe_load(open('.github/workflows/project-state-conformance.yml'))
          i = w[True]['workflow_call']['inputs']['actions_runtime']
          assert i['type'] == 'string' and i['default'] == 'report' and i['required'] is False, i
          print('Q0 default actions_runtime=report PASS')
          PY
          # Q1: enforce with a compliant workflow
          python $G --mode enforce $F/node24-positive.yml
          # Q2: enforce rejects Node.js 20, report does not
          if python $G --mode enforce $F/node20-negative.yml > gate-enforce.out; then
            cat gate-enforce.out; echo "Expected enforce to fail"; exit 1
          fi
          cat gate-enforce.out
          grep -q '^::error::' gate-enforce.out
          python $G --mode report $F/node20-negative.yml > gate-report.out
          cat gate-report.out
          grep -q '^::warning::' gate-report.out
          grep -q '^REPORT: ' gate-report.out
          # Q2: invalid mode fails
          if python $G --mode strict $F/node24-positive.yml; then
            echo "Expected invalid mode to fail"; exit 1
          fi
          # Q3: unmapped official actions never fail, in either mode
          python $G --mode enforce $F/unmapped-official.yml
          python $G --mode report $F/unmapped-official.yml
          # summary file is written
          rm -f gate-summary.md
          python $G --mode report --summary gate-summary.md $F/node20-negative.yml > /dev/null
          grep -q 'GitHub Actions runtime check (report)' gate-summary.md
          rm -f gate-enforce.out gate-report.out gate-summary.md
          echo "Actions runtime gate modes PASS"
      - name: Qualify actions runtime map maintenance
        shell: bash
        run: bash qualification/actions-runtime-map/run_qualification.sh
      - name: Qualify CI usage report
        shell: bash
        run: bash qualification/ci-usage-report/run_qualification.sh
      - name: Qualify pin reference finder
        shell: bash
        run: bash qualification/pin-references/run_qualification.sh
      - name: Validate reusable project bootstrap conformance
        run: >-
          python tools/validate_project_bootstrap.py
          qualification/project-conformance/valid
          --om-root .
          --skip-om-git-pin-check
      - name: Qualify invalid project bootstrap rejection
        shell: bash
        run: |
          if python tools/validate_project_bootstrap.py qualification/project-conformance/invalid --om-root . --skip-om-git-pin-check; then
            echo "Expected invalid project bootstrap to fail"
            exit 1
          fi
          echo "Negative project bootstrap conformance PASS"
      - name: Qualify uninstantiated DEV template rejection
        shell: bash
        run: |
          if python tools/validate_project_bootstrap.py qualification/project-conformance/uninstantiated-template --om-root . --skip-om-git-pin-check; then
            echo "Expected uninstantiated DEV template to fail"
            exit 1
          fi
          echo "Uninstantiated DEV template rejection PASS"
