name: Validate OM2

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'om-v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  structural-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate structural contracts
        run: python tools/validate.py
      - name: Qualify minimal recovery
        run: >-
          python tools/recovery_probe.py
          qualification/recovery/fixtures
          --expected qualification/recovery/expected.json
      - name: Qualify solo recovery
        run: >-
          python tools/recovery_probe.py
          qualification/recovery/fixtures-solo
          --expected qualification/recovery/expected-solo.json
      - name: Qualify OM 2.1 policy semantics
        run: python tools/qualify_om21.py
      - name: Qualify release identity pin guard
        shell: bash
        run: |
          GOOD=0123456789abcdef0123456789abcdef01234567
          BAD=89abcdef0123456789abcdef0123456789abcdef
          python tools/release_identity_guard.py --expected "$GOOD" --observed "$GOOD"
          if python tools/release_identity_guard.py --expected "$GOOD" --observed "$BAD"; then
            echo "Expected release identity mismatch to fail"
            exit 1
          fi
          echo "Release identity mismatch rejection PASS"
      - name: Validate reusable project bootstrap conformance
        run: >-
          python tools/validate_project_bootstrap.py
          qualification/project-conformance/valid
          --om-root .
          --skip-om-git-pin-check
      - name: Qualify invalid project bootstrap rejection
        shell: bash
        run: |
          if python tools/validate_project_bootstrap.py qualification/project-conformance/invalid --om-root . --skip-om-git-pin-check; then
            echo "Expected invalid project bootstrap to fail"
            exit 1
          fi
          echo "Negative project bootstrap conformance PASS"
      - name: Qualify uninstantiated DEV template rejection
        shell: bash
        run: |
          if python tools/validate_project_bootstrap.py qualification/project-conformance/uninstantiated-template --om-root . --skip-om-git-pin-check; then
            echo "Expected uninstantiated DEV template to fail"
            exit 1
          fi
          echo "Uninstantiated DEV template rejection PASS"
