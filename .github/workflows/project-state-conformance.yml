name: OM Project State Conformance

on:
  workflow_call:
    inputs:
      om_ref:
        description: Immutable adopted OM ref, for example om-v2.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  project-state-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v6

      - name: Checkout adopted Operating Model
        uses: actions/checkout@v6
        with:
          repository: ro-pecha-labs/ai-assisted-development-operating-model
          ref: ${{ inputs.om_ref }}
          path: .om

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: pip install -r .om/requirements.txt

      - name: Validate project bootstrap against adopted OM
        run: python .om/tools/validate_project_bootstrap.py . --om-root .om

      - name: Report GitHub Actions runtime status (non-blocking)
        shell: bash
        run: |
          if [ ! -f .om/tools/actions_runtime_guard.py ]; then
            echo "::notice::Adopted OM revision has no actions runtime guard; skipped"
            exit 0
          fi
          if [ ! -d .github/workflows ]; then
            echo "No .github/workflows in caller repository; nothing to scan"
            exit 0
          fi
          python .om/tools/actions_runtime_guard.py --report .github/workflows | tee actions-runtime-report.txt
          {
            echo "### GitHub Actions runtime report (non-blocking)"
            echo '```'
            cat actions-runtime-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^REPORT: ' actions-runtime-report.txt; then
            echo "::warning::Deprecated Node.js action runtime references found in caller workflows (report only; does not affect conformance)"
          fi
          rm actions-runtime-report.txt
