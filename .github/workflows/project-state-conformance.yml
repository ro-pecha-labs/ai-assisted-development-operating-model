name: OM Project State Conformance

on:
  workflow_call:
    inputs:
      om_ref:
        description: Immutable adopted OM ref, for example om-v2.1.0
        required: true
        type: string
      actions_runtime:
        description: >-
          Node.js runtime check of the caller's GitHub workflows: report (default, never fails)
          or enforce (fails on a mapped action pinned below its Node.js 24 major)
        required: false
        type: string
        default: report

permissions:
  contents: read

jobs:
  project-state-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v6

      - name: Checkout adopted Operating Model
        uses: actions/checkout@v6
        with:
          repository: ro-pecha-labs/ai-assisted-development-operating-model
          ref: ${{ inputs.om_ref }}
          path: .om

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: pip install -r .om/requirements.txt

      - name: Validate project bootstrap against adopted OM
        run: python .om/tools/validate_project_bootstrap.py . --om-root .om

      - name: GitHub Actions runtime check
        shell: bash
        env:
          ACTIONS_RUNTIME_MODE: ${{ inputs.actions_runtime }}
        run: |
          case "$ACTIONS_RUNTIME_MODE" in
            report|enforce) ;;
            *) echo "::error::Invalid actions_runtime '$ACTIONS_RUNTIME_MODE'; expected report or enforce"; exit 2 ;;
          esac
          if [ ! -f .om/tools/actions_runtime_gate.py ]; then
            if [ "$ACTIONS_RUNTIME_MODE" = "enforce" ]; then
              echo "::error::actions_runtime=enforce requires an adopted OM revision that provides tools/actions_runtime_gate.py"
              exit 2
            fi
            echo "::notice::Adopted OM revision has no actions runtime gate; skipped"
            exit 0
          fi
          if [ ! -d .github/workflows ]; then
            echo "No .github/workflows in caller repository; nothing to scan"
            exit 0
          fi
          python .om/tools/actions_runtime_gate.py --mode "$ACTIONS_RUNTIME_MODE" --summary "$GITHUB_STEP_SUMMARY" .github/workflows
